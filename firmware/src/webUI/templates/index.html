<!DOCTYPE html>
<html>

<head>
    <title>Radas Web Interface</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Radas Web Interface</h1>

    <button onclick="startCollecting()">
        Start Collecting Data
    </button>

    <button onclick="stopCollecting()">
        Stop Collecting Data
    </button>

    <h2>Data Collection Status</h2>
    <div id="recording">
        Data collection has not been started yet.
    </div>
    <div id="status">
        Ready
    </div>

    <script>
        async function startCollecting() {
            const response = await fetch('/datacollection/start',
                { method: 'POST' }
            );

            const data = await response.json();

            document.getElementById('recording').innerText = data.message || "Data collection started.";
        }

        async function stopCollecting() {
            const response = await fetch('/datacollection/stop',
                { method: 'POST' }
            );
            const data = await response.json();
            document.getElementById('recording').innerText = data.message || "Data collection stopped.";
        }
    </script>

    <script>
        function levelLabel(level) {
            if (level === 0) return "Good";
            if (level === 1) return "Warning";
            if (level === 2) return "Error";
            if (level === 3) return "Stale";
            return "Unknown";
        }

        function renderSensorSummary(sensors) {
            const tbody = document.getElementById("sensor-summary-body");
            tbody.innerHTML = "";

            for (const sensor of sensors) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${sensor.emoji}</td>
                    <td>${sensor.name}</td>
                    <td>${levelLabel(sensor.level)}</td>
                    <td class="hz-column">${sensor.hz ?? "--"} / ${sensor.expected_hz ?? "--"} Hz</td>
                    <td>${sensor.packet_loss ?? "--"}</td>
                `;

                tbody.appendChild(row);
            }
        }
    </script>
    <h2>Sensor Status</h2>

    <table class="status-table">
        <thead>
            <tr>
                <th>Status</th>
                <th>Sensor</th>
                <th>Level</th>
                <th>Hz</th>
                <th>Packet Loss</th>
            </tr>
        </thead>
        <tbody id="sensor-summary-body"></tbody>
    </table>

    <script>

        async function updateDiagnostics() {
            const response = await fetch('/diagnostics');
            const data = await response.json();

            renderSensorSummary(data.sensors || []);

            const statusEl = document.getElementById('status');

            if (!data.last_update) {
                statusEl.innerText = "Awaiting aggregated diagnostics...";
            }
            else {
                const age = Date.now() / 1000 - data.last_update;

                if (age > 5) {
                    statusEl.innerText = "Diagnostics: timeout";
                }
                else {
                    statusEl.innerText = `Diagnostics: ${data.overall_status || 'UNKNOWN'}`;
                }
            }

            const recordingEl = document.getElementById('recording');

            if (data.recording_message) {
                recordingEl.innerText = data.recording_message;
            }
        }

        setInterval(updateDiagnostics, 1000);
        updateDiagnostics();
    </script>
</body>

</html>
