# Example configuration Settings for the Rover Rx

device: serial:/dev/ttyACM1

serial:
  baudrate: 921600
  hw_flow_control: "off"

stream_device:
  tcp:
    ip_server: ""
    port: 0
  udp:
    ip_server: ""
    port: 0
    unicast_ip: ""

configure_rx: true

custom_commands_file: ""

login:
  user: ""
  password: ""

osnma:
  mode: "off"
  ntp_server: ""
  keep_open: false

frame_id: gnss

imu_frame_id: imu

poi_frame_id: base_link

vsm_frame_id: vsm

aux1_frame_id: aux1

vehicle_frame_id: base_link

insert_local_frame: false

local_frame_id: odom

get_spatial_config_from_tf: false

lock_utm_zone: false

use_ros_axis_orientation: true

receiver_type: gnss

multi_antenna: true

datum: Default

poi_to_arp:
  delta_e: 0.0
  delta_n: 0.0
  delta_u: 0.0

att_offset:
  heading: 0.0
  pitch: 0.0

ant_type: Unknown
ant_aux1_type: Unknown
ant_serial_nr: Unknown
ant_aux1_serial_nr: Unknown

leap_seconds: 18

polling_period:
  pvt: 500
  rest: 500

use_gnss_time: true
ntp_server: false
ptp_server_clock: false
latency_compensation: false

rtk_settings:
  ntrip_1:
    id: "NTR1"
    caster: "opencaster.nls.fi"
    caster_port: 2102
    username: ""
    password: ""
    mountpoint: "DGNSS-MSM1"
    version: "v2"
    tls: false
    fingerprint: ""
    rtk_standard: "RTCMv3"
    send_gga: "auto"
    keep_open: true

  ntrip_2:
    id: ""
    caster: ""
    caster_port: 2101
    username: ""
    password: ""
    mountpoint: ""
    version: "v2"
    tls: false
    fingerprint: ""
    rtk_standard: "auto"
    send_gga: "auto"
    keep_open: true

  ip_server_1:
    id: ""
    port: 0
    rtk_standard: ""
    send_gga: "auto"
    keep_open: true

  ip_server_2:
    id: ""
    port: 0
    rtk_standard: ""
    send_gga: "auto"
    keep_open: true

  serial_1:
    port: ""
    baud_rate: 115200
    rtk_standard: "auto"
    send_gga: "off"
    keep_open: true

  serial_2:
    port: ""
    baud_rate: 115200
    rtk_standard: "auto"
    send_gga: "off"
    keep_open: true


publish:
  # For both GNSS and INS Rxs 
  auto_publish: false
  publish_only_valid: false
  navsatfix: true
  gpsfix: true
  gpgga: false
  gprmc: false
  gpst: false
  measepoch: false
  pvtcartesian: false
  pvtgeodetic: true
  basevectorcart: true
  basevectorgeod: true
  poscovcartesian: false
  poscovgeodetic: true
  velcovcartesian: false
  velcovgeodetic: false
  atteuler: true
  attcoveuler: true
  pose: false
  twist: false
  diagnostics: true
  aimplusstatus: true
  galauthstatus: false
  # For GNSS Rx only
  gpgsa: false
  gpgsv: false
  # For INS Rx only
  insnavcart: false
  insnavgeod: false
  extsensormeas: false
  imusetup: false
  velsensorsetup: false
  exteventinsnavcart: false
  exteventinsnavgeod: false
  imu: false
  localization: false
  tf: false    
  localization_ecef: false
  tf_ecef: false

# Logger

activate_debug_log: true